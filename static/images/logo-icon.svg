<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Skillverse Icon Logo: Knowledge & Growth (Graduation Cap + Open Book) -->
  
  <!-- 1. GRADUATION CAP (Academic Achievement & Career Growth) -->
  <g id="graduation-cap">
    <!-- Cap Skull Base / Under-crown -->
    <path d="M34 32 C34 42.5 41 46.5 50 46.5 C59 46.5 66 42.5 66 32" fill="#2E2A27"/>
    
    <!-- Mortarboard Diamond - Modern Flat Facet Duo -->
    <!-- Left Facet (Light Charcoal #48423D) -->
    <polygon points="50,15 16,28 50,40" fill="#48423D"/>
    <!-- Right Facet (Dark Charcoal #36312D) -->
    <polygon points="50,15 84,28 50,40" fill="#36312D"/>
    <!-- Precision Rim Outline -->
    <polygon points="50,15 84,28 50,40 16,28" fill="none" stroke="#403B36" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Center Apex Button (Primary Terracotta #C46B4F) -->
    <circle cx="50" cy="28" r="3" fill="#C46B4F"/>
    
    <!-- Flowing Tassel -->
    <!-- Tassel Cord -->
    <path d="M50 28 C64 26 77 32 81 39 C83.5 43.5 83.5 48.5 83 54" fill="none" stroke="#C46B4F" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Tassel Band (Soft Peach #E7B69B) -->
    <circle cx="83" cy="54" r="1.8" fill="#E7B69B"/>
    <!-- Tassel Brush / Fringe -->
    <path d="M81 55.5 L85 55.5 L84.5 64.5 C84.5 65.5 81.5 65.5 81.5 64.5 Z" fill="#C46B4F"/>
  </g>

  <!-- 2. INTEGRATION STEM (Connecting Cap to Open Book) -->
  <g id="crest-stem">
    <path d="M48.5 44 L50 41 L51.5 44 L51.5 51 L48.5 51 Z" fill="#C46B4F"/>
  </g>

  <!-- 3. OPEN BOOK (Knowledge, Learning & Skills) -->
  <g id="open-book">
    <!-- Base / Cover Foundation (Charcoal #403B36) -->
    <!-- Left Cover Spine Base -->
    <path d="M12 70.5 C24 71.5 36 73 48 77.5 L48 83 C35 77.5 22 75.8 10 75 C9.4 74.5 9.6 71.2 12 70.5 Z" fill="#403B36"/>
    <!-- Right Cover Spine Base -->
    <path d="M88 70.5 C76 71.5 64 73 52 77.5 L52 83 C65 77.5 78 75.8 90 75 C90.6 74.5 90.4 71.2 88 70.5 Z" fill="#403B36"/>
    <!-- Central Spine Finial -->
    <polygon points="48,77.5 50,84.5 52,77.5" fill="#403B36"/>

    <!-- Lower Layer Page Wings (Soft Peach Accent #E7B69B) -->
    <path d="M14 65.5 C25 65 37 66.8 48 73.2 L48 76 C36 70.2 23 68.8 13.5 69.2 Z" fill="#E7B69B" opacity="0.6"/>
    <path d="M86 65.5 C75 65 63 66.8 52 73.2 L52 76 C64 70.2 77 68.8 86.5 69.2 Z" fill="#E7B69B" opacity="0.6"/>

    <!-- Primary Open Page Wings (Primary Terracotta #C46B4F) -->
    <!-- Left Wing -->
    <path d="M48 51.5 C35 47 23 45 13.8 45.8 C12.6 46 12.3 47.5 12.6 49 L13.5 65 C24 64 36 65.5 48 72 Z" fill="#C46B4F"/>
    <!-- Right Wing -->
    <path d="M52 51.5 C65 47 77 45 86.2 45.8 C87.4 46 87.7 47.5 87.4 49 L86.5 65 C76 64 64 65.5 52 72 Z" fill="#C46B4F"/>

    <!-- Inner Dynamic Highlights (Soft Peach #E7B69B) -->
    <path d="M47 55.5 C37 52 27 51.2 18.5 52.5 L18.5 56 C27 55 37 55.8 47 60 Z" fill="#E7B69B"/>
    <path d="M53 55.5 C63 52 73 51.2 81.5 52.5 L81.5 56 C73 55 63 55.8 53 60 Z" fill="#E7B69B"/>
    
    <!-- Central Bookmark / Spine Core (Warm Beige #F3E9D9) -->
    <rect x="49.2" y="51.5" width="1.6" height="23" rx="0.8" fill="#F3E9D9" opacity="0.85"/>
  </g>
</svg>